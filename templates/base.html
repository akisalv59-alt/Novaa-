<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>{% block title %}NOVA STORE · Objets du quotidien{% endblock %}</title><link rel="stylesheet" href="/static/studio.css"><script defer src="/static/studio.js"></script></head><body>
<header class="mast"><div class="bar"><button class="plain menubtn" id="menu-toggle" aria-expanded="false" aria-controls="nav">☰ <span>Menu</span></button><a class="brand" href="/" aria-label="NOVA STORE accueil"><i></i>NOVA<span>STORE</span></a><nav id="nav"><a href="/#collection">Collection</a><a href="/#categories">Catégories</a></nav><button id="bag-open" class="plain bag"><i></i>Panier <b id="qty">0</b></button></div></header>
<main>{% block main %}{% endblock %}</main><footer><a class="brand" href="/"><i></i>NOVA<span>STORE</span></a><a href="/#collection">La collection</a><a href="/admin">Administration</a></footer>
<dialog id="bag" aria-labelledby="bag-title"><div class="baghead"><h2 id="bag-title">Votre panier</h2><button class="circle" id="bag-close" aria-label="Fermer le panier">×</button></div><div id="lines"></div><section class="summary"><div><b>Sous-total</b><b id="total">0,00 €</b></div><p><span id="quote">Simulation en France. Aucun débit réel.</span></p><button class="primary" id="draft" disabled>Payer en mode test</button><p role="status" id="feedback"></p></section></dialog>
</body></html>
