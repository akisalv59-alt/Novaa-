<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Gestion du catalogue · NOVA STORE</title><link rel="stylesheet" href="/static/studio.css"><script defer src="/static/manage.js"></script></head><body><main class="admin"><a href="/">← Boutique</a><p class="kicker">NOVA STORE</p><h1>Gestion du catalogue</h1><form id="login"><label>Jeton GitHub à accès limité<input type="password" id="token" required autocomplete="off" autocapitalize="none" spellcheck="false"></label><p>Utilisez un jeton limité au dépôt Novaa-, avec le droit d’écriture sur son contenu. Il est envoyé directement à GitHub et oublié à la fermeture de cette page.</p><a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener noreferrer">Créer un jeton sur GitHub</a><button class="primary">Ouvrir le catalogue</button></form><section id="editor" hidden><button id="logout">Se déconnecter</button><label>Produit<select id="pick"></select></label><form id="edit"><label>Nom<input id="name" maxlength="80" required></label><label>Catégorie<input id="category" maxlength="40" required></label><label>Prix en euros<input id="price" type="number" step=".01" min=".01" max="99999" required></label><label>Description<textarea id="description" required maxlength="600"></textarea></label><label>Caractéristiques, une par ligne<textarea id="details" maxlength="2000"></textarea></label><label>Adresse HTTPS de la photo autorisée<input id="image" type="url" placeholder="https://…" pattern="https://.+"></label><label><span><input id="visible" type="checkbox"> Afficher dans la boutique</span></label><button class="primary">Publier la fiche</button></form></section><p id="status" role="status"></p></main></body></html>
